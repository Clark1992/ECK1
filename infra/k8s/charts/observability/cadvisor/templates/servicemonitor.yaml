{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cadvisor.fullname" . }}
  labels:
{{ include "cadvisor.labels" . | indent 4 }}
{{- with .Values.serviceMonitor.labels }}
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cadvisor.name" . }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: {{ .Values.service.name }}
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      honorLabels: true
      metricRelabelings:
        # cAdvisor exposes Kubernetes labels as container_label_*.
        # Normalize them to the standard namespace/pod/container labels.
        - action: replace
          sourceLabels: [container_label_io_kubernetes_pod_namespace]
          targetLabel: namespace
        - action: replace
          sourceLabels: [container_label_io_kubernetes_pod_name]
          targetLabel: pod
        - action: replace
          sourceLabels: [container_label_io_kubernetes_container_name]
          targetLabel: container

        # Keep only the container_* metrics used by dashboards.
        - action: keep
          sourceLabels: [__name__]
          regex: "container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_usage_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_reads_bytes_total|fs_writes_bytes_total)"

        # Preserve id for OpenLens cluster-level queries against the root
        # cgroup. Keep pod series plus id="/"; discard other host cgroups.
        - action: labeldrop
          regex: "^(container_id|name)$"
        - action: keep
          sourceLabels: [namespace, pod, id]
          regex: "^.+;.+;.*$|^;;/$"
{{- end }}
