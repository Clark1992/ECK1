compactor:
  affinity: |
    {}
  config:
    compaction:
      block_retention: 168h
  extraVolumeMounts:
    - mountPath: /tempo-nfs
      name: tempo-nfs
  extraVolumes:
    - name: tempo-nfs
      persistentVolumeClaim:
        claimName: tempo-shared
distributor:
  affinity: |
    {}
  extraVolumeMounts:
    - mountPath: /tempo-nfs
      name: tempo-nfs
  extraVolumes:
    - name: tempo-nfs
      persistentVolumeClaim:
        claimName: tempo-shared
gateway:
  affinity: |
    {}
ingester:
  config:
    replication_factor: 1
  extraVolumeMounts:
    - mountPath: /tempo-nfs
      name: tempo-nfs
  extraVolumes:
    - name: tempo-nfs
      persistentVolumeClaim:
        claimName: tempo-shared
  replicas: 1
memcached:
  affinity: |
    {}
metricsGenerator:
  affinity: |
    {}
  # Derived span metrics, service graphs and TraceQL metrics are not used by
  # the repository dashboards. Disabling the generator does not affect trace
  # ingestion, storage, search or viewing in Grafana.
  enabled: false
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
querier:
  affinity: |
    {}
  extraVolumeMounts:
    - mountPath: /tempo-nfs
      name: tempo-nfs
  extraVolumes:
    - name: tempo-nfs
      persistentVolumeClaim:
        claimName: tempo-shared
queryFrontend:
  affinity: |
    {}
  config:
    metrics:
      query_backend_after: 2h
  extraVolumeMounts:
    - mountPath: /tempo-nfs
      name: tempo-nfs
  extraVolumes:
    - name: tempo-nfs
      persistentVolumeClaim:
        claimName: tempo-shared
search:
  enabled: true
storage:
  trace:
    backend: local

metaMonitoring:
  serviceMonitor:
    # Tempo component internals are not referenced by the local dashboards.
    enabled: false
tempo:
  structuredConfig:
    auth_enabled: false
    storage:
      trace:
        local:
          path: /tempo-nfs/traces
        wal:
          path: /tempo-nfs/wal
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true
